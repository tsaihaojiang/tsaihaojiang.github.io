    <div id="ListAllTag" class="tag-results"></div>

  </div>

  <div id="dashboard"></div>

    fetch('../dashboard.html').then(r => r.text()).then(d => document.getElementById('dashboard').innerHTML = d);

<div id="footer"></div>

  fetch('../footer.html').then(r => r.text()).then(d => document.getElementById('footer').innerHTML = d);
