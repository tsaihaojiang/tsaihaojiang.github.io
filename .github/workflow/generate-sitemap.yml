name: Generate Sitemap

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:     # 允許手動執行

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 必須要有這行，才能取得最後修改日期

      - name: Generate sitemap.xml
        id: sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://tsaihaojiang.github.io/
          include-html: true
          exclude-paths: |
            template.html
            header.html
            footer.html
            dashboard.html
            *.css
            *.js

      - name: Commit and push sitemap.xml
        run: |
          if [[ -n "$(git status --porcelain sitemap.xml)" ]]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "chore: update sitemap.xml automatically"
            git push
          else
            echo "No changes to sitemap.xml"
          fi
